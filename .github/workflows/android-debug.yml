name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare output directory
        run: mkdir -p build

      - name: Check Godot project and export Android debug APK
        run: |
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/SnakeBattle-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeBattle-Android-debug
          path: build/SnakeBattle-debug.apk
          if-no-files-found: error
