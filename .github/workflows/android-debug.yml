name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Export Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/
          fi

      - name: Check project files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/main.tscn
          test -f scripts/game.gd
          mkdir -p build

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Export Android debug APK
        run: godot --headless --path . --verbose --export-debug "Android" build/SnakeBattle-debug.apk

      - name: Verify APK
        run: test -s build/SnakeBattle-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeBattle-Android-debug
          path: build/SnakeBattle-debug.apk
          if-no-files-found: error
          retention-days: 14
